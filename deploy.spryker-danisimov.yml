namespace: spryker
tag: 'dev'

environment: docker.dev
image:
    tag: spryker/php:8.3
    php:
        ini:
            'upload_max_filesize': '100M'
            'post_max_size': '100M'
    environment:
        SPRYKER_PRODUCT_CONFIGURATOR_HOST: date-time-configurator.spryker-danisimov.cloud.spryker.toys
        SPRYKER_PRODUCT_CONFIGURATOR_PORT: 80
        SPRYKER_PRODUCT_CONFIGURATOR_ENCRYPTION_KEY: 'change123'
        SPRYKER_PRODUCT_CONFIGURATOR_HEX_INITIALIZATION_VECTOR: '0c1ffefeebdab4a3d839d0e52590c9a2'
        SPRYKER_PUSH_NOTIFICATION_WEB_PUSH_PHP_VAPID_PUBLIC_KEY: 'BGqNWbv0hWM5CQ1-KwAfSQBMC6TMVFyrnh3vQp37oGCNvQ6eG_HyMjxBFJRWeCPTbzDoxcjhxLJS8Ck8r1G2oFw'
        SPRYKER_PUSH_NOTIFICATION_WEB_PUSH_PHP_VAPID_PRIVATE_KEY: 'UK6DywwjKITPpRHBSY9TLPIXm6BPrHX40sseIoXT9c8'
        SPRYKER_PUSH_NOTIFICATION_WEB_PUSH_PHP_VAPID_SUBJECT: 'https://spryker.com'
        SPRYKER_DYNAMIC_STORE_MODE: true
        SPRYKER_YVES_HOST_EU: yves.eu.spryker-danisimov.cloud.spryker.toys
        SPRYKER_YVES_HOST_US: yves.us.spryker-danisimov.cloud.spryker.toys
    node:
        version: 18
        npm: 9

composer:
    mode: ''
    autoload: ''

assets:
    mode: development

regions:
    EU:
        services:
            mail:
                sender:
                    name: Spryker No-Reply
                    email: no-reply@spryker-danisimov.cloud.spryker.toys
            database:
                database: spryker_danisimov
                username: spryker
                password: secret

            broker:
                namespace: eu-docker
            key_value_store:
                namespace: 1
            search:
                namespace: eu_search

    US:
        services:
            mail:
                sender:
                    name: Spryker No-Reply
                    email: no-reply@spryker-danisimov.cloud.spryker.toys
            database:
                database: us-docker
                username: spryker
                password: secret
            broker:
                namespace: us-docker
            key_value_store:
                namespace: 2
            search:
                namespace: us_search

groups:
    EU:
        region: EU
        applications:
            yves:
                application: yves
                endpoints:
                    date-time-configurator.spryker-danisimov.cloud.spryker.toys:
                        entry-point: Configurator
                    yves.eu.spryker-danisimov.cloud.spryker.toys:
                        region: EU
                        services:
                            session:
                                namespace: 2
                http:
                    max-request-body-size: 100M
            glue:
                application: glue
                endpoints:
                    glue.eu.spryker-danisimov.cloud.spryker.toys:
                        region: EU
            boffice:
                application: backoffice
                endpoints:
                    backoffice.eu.spryker-danisimov.cloud.spryker.toys:
                        region: EU
                        primal: true
                        services:
                            session:
                                namespace: 3
                http:
                    max-request-body-size: 100M
            backgw:
                application: backend-gateway
                endpoints:
                    backend-gateway.eu.spryker-danisimov.cloud.spryker.toys:
                        region: EU
                        primal: true
            backapi:
                application: zed
                endpoints:
                    backend-api.eu.spryker-danisimov.cloud.spryker.toys:
                        region: EU
                        entry-point: BackendApi

    US:
        region: US
        applications:
            yves:
                application: yves
                endpoints:
                    yves.us.spryker-danisimov.cloud.spryker.toys:
                        region: US
                        services:
                            session:
                                namespace: 5
            glue:
                application: glue
                endpoints:
                    glue.us.spryker-danisimov.cloud.spryker.toys:
                        region: US
            boffice:
                application: backoffice
                endpoints:
                    backoffice.us.spryker-danisimov.cloud.spryker.toys:
                        region: US
                        primal: true
                        services:
                            session:
                                namespace: 6
            backgw:
                application: backend-gateway
                endpoints:
                    backend-gateway.us.spryker-danisimov.cloud.spryker.toys:
                        region: US
                        primal: true
            backapi:
                application: zed
                endpoints:
                    backend-api.us.spryker-danisimov.cloud.spryker.toys:
                        region: US
                        entry-point: BackendApi
services:
    database:
        engine: mysql
        version: mariadb-10.6
        root:
            username: 'root'
            password: 'secret'
        endpoints:
            localhost:3306:
                protocol: tcp
    broker:
        engine: rabbitmq
        version: '3.9'
        api:
            username: 'spryker'
            password: 'secret'
        endpoints:
            queue.spryker-danisimov.cloud.spryker.toys:
            localhost:5672:
                protocol: tcp
    session:
        engine: redis
    key_value_store:
        engine: redis
        endpoints:
            localhost:16379:
                protocol: tcp
    search:
        engine: elastic
        version: '7.10'
        endpoints:
            localhost:9200:
                protocol: tcp
    scheduler:
        engine: jenkins
        version: '2.442'
        csrf-protection-enabled: false
        endpoints:
            scheduler.spryker-danisimov.cloud.spryker.toys:
    mail_catcher:
        engine: mailhog
        endpoints:
            mail.spryker-danisimov.cloud.spryker.toys:
docker:
    ssl:
        enabled: true
        redirect: true

    testing:
        region: EU

    debug:
        enabled: false
        xdebug:
            enabled: false

    mount:
        baked:
